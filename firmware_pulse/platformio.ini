; Physical — firmware de la banda de pulso, variante Pulse Sensor Amped
; (sensor analógico). La variante MAX30102 (I2C) vive en ../firmware.
; Ver README.md para wiring, flasheo y verificación.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Sin lib_deps: la pila BLE (BLEDevice.h y compañía) viene incluida en el
; framework Arduino de ESP32, y el Pulse Sensor Amped no necesita driver —
; es una salida analógica que se lee con analogRead(). La detección de
; latidos está implementada en HeartRateSensor.cpp.
