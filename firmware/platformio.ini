; Physical — firmware de la banda de pulso (ESP-32 + MAX30102).
; Ver README.md para wiring, flasheo y verificación.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; La pila BLE (BLEDevice.h y compañía) viene incluida en el framework Arduino
; de ESP32 — no es una lib_dep aparte. Sólo hace falta declarar el driver del
; sensor de pulso.
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.1
